services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ligeria-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CORS_ORIGIN=http://localhost:3000,http://localhost:80
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ligeria-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
